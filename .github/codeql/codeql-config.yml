name: "CodeQL config"

# Alembic migration scripts under alembic/versions are generated from a template.
# They define module-level globals (revision, down_revision, branch_labels,
# depends_on) that Alembic reads by name at runtime, so CodeQL's quality query
# py/unused-global-variable flags them as unused. Renaming or removing them would
# break Alembic, so exclude the generated migrations from analysis. (paths-ignore
# is honoured for interpreted languages built with build-mode: none.)
paths-ignore:
  - backend/alembic/versions

# The SQLAlchemy models reference each other's classes only for type hints, imported
# under `if TYPE_CHECKING:` (never executed at runtime; relationship() resolves the
# targets by name). py/unsafe-cyclic-import does not model the TYPE_CHECKING guard, so
# it reports every model pair as a runtime import cycle. A real cycle would raise an
# ImportError at import time, which the test suite catches, so the query adds only
# false positives here.
query-filters:
  - exclude:
      id: py/unsafe-cyclic-import
